<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Admin — Orbital Relay</title>
  <link rel="stylesheet" href="/css/tokens.css">
  <link rel="stylesheet" href="/css/chrome.css">
  <link rel="stylesheet" href="./admin.css">
  <link rel="icon" href="/icon.svg" type="image/svg+xml">
</head>
<body data-page-id="admin">

  <!-- Login screen (shown when not authenticated) -->
  <div id="login-screen" class="admin-login" hidden>
    <form id="login-form" class="admin-login__form">
      <p class="admin-login__brand">ORBITAL RELAY</p>
      <h1 class="admin-login__title">// ADMIN CONSOLE</h1>
      <label class="admin-login__label" for="login-password">Password</label>
      <div class="admin-login__field">
        <input id="login-password" class="admin-login__input" type="password"
               autocomplete="current-password" required>
        <button id="pw-toggle" class="admin-login__toggle" type="button"
                aria-label="Show password" aria-pressed="false" title="Show password">◉</button>
      </div>
      <button id="login-btn" type="submit" class="admin-login__btn">AUTHENTICATE</button>
      <p id="login-error" class="admin-login__error" role="alert" hidden></p>
      <p class="admin-login__hint">Session lasts 12h · protected console</p>
    </form>
  </div>

  <!-- Dashboard shell (shown after auth): sidebar + content -->
  <div id="admin-shell" class="admin-shell" hidden>
    <aside id="admin-nav" class="admin-nav" aria-label="Admin navigation">
      <div class="admin-nav__brand">
        <span class="admin-nav__logo">ORBITAL RELAY</span>
        <span class="admin-nav__sub">// ADMIN CONSOLE</span>
      </div>
      <ul id="admin-nav-list" class="admin-nav__list" role="listbox"></ul>
      <div class="admin-nav__foot">
        <div id="admin-nav-status" class="admin-nav__status" title="Connection status">standby</div>
        <button id="logout-btn" class="admin-nav__logout" type="button">LOGOUT</button>
      </div>
    </aside>
    <div id="admin-backdrop" class="admin-backdrop" hidden></div>

    <div class="admin-main">
      <header class="admin-topbar">
        <button id="nav-toggle" class="admin-topbar__toggle" type="button"
                aria-label="Toggle navigation" aria-expanded="false" title="Menu">☰</button>
        <h1 id="admin-panel-title" class="admin-topbar__title">—</h1>
        <div class="admin-topbar__meta">
          <span id="admin-last-updated" class="admin-topbar__time"></span>
          <button id="admin-refresh" class="admin-topbar__refresh" type="button"
                  aria-label="Refresh panel" title="Refresh (R)">⟳</button>
        </div>
      </header>
      <main id="admin-panels" class="admin-panels"></main>
    </div>
  </div>

  <div id="admin-toasts" class="admin-toasts" aria-live="polite"></div>

  <footer class="admin-foot">
    Counts are Space-Track-derived. Data source: Space-Track.org (USSPACECOM /
    18th Space Defense Squadron), redistributed under express blanket approval
    for basic SSA data.
  </footer>

  <script type="module" src="./admin.js"></script>
</body>
</html>
