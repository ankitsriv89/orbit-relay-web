# Cloudflare Pages config for Orbital Relay
# Deploy: git push → Cloudflare auto-deploys from GitHub
# Domain: orbitalrelay.space

name = "orbit-relay"
pages_build_output_dir = "public"
compatibility_date = "2024-11-01"

# ---- Orbit catalog D1 binding (shared from signal-playground) --------
# Read side only. The Pages Functions (/api/object, /api/search, /api/feed, and
# the tle.js Space-Track read-through) query this; the orbit-ingest Worker owns
# writing to it and carries its own copy of this binding.
#
# Schema is applied in the signal-playground wrangler.toml:
#   wrangler d1 execute orbit-catalog --remote --file d1/orbit.sql
[[d1_databases]]
binding = "ORBIT_DB"
database_name = "orbit-catalog"
database_id = "e5fe1563-71ef-4fb4-9e04-554c87caf821"

# ---- Object profiles D1 binding --------------------------------------
# Read side only. functions/api/_profiles.js queries this for the descriptive
# knowledge base (/api/profile, /api/objects, and the `profile` key on
# /api/object); the orbit-profiles Worker owns writing to it and carries its own
# copy of this binding.
#
# A second database rather than more tables in orbit-catalog because D1 cannot
# join across databases and the isolation is worth that cost — enrichment writes
# stay away from the orbital read budget.
#
# As with ORBIT_DB above, this block is documentation: the binding that actually
# takes effect at runtime is the one added in the Pages dashboard (Settings →
# Functions → Bindings), name PROFILE_DB, database orbit-profiles. When it is
# absent, profileFor() returns null and every endpoint degrades to
# `profile: null` rather than erroring.
#
# Schema:
#   wrangler d1 execute orbit-profiles --remote --file d1/profiles.sql
[[d1_databases]]
binding = "PROFILE_DB"
database_name = "orbit-profiles"
database_id = "0b90f275-abe7-47c4-bf55-4c43af24d8cc"

# ---- Orbit artifacts R2 binding (shared from signal-playground) ------
# Pre-rendered TLE bundles + feed JSON, regenerated after each ingest so the
# globe's hot path is a flat object read rather than a D1 query. Read side only
# here; the orbit-ingest Worker writes these and carries its own binding.
[[r2_buckets]]
binding = "ORBIT_R2"
bucket_name = "orbit-data"

# ---- Public API rate limiting ----------------------------------------------
# 30 requests/minute per IP over /api/*, applied by functions/api/_middleware.js
# via the shared helper in functions/api/_ratelimit.js.
#
# The binding is NOT declared here. It was, as:
#
#   [[unsafe.bindings]]
#   name = "API_RATE_LIMITER"
#   type = "ratelimit"
#   namespace_id = "1001"
#   simple = { limit = 30, period = 60 }
#
# and that broke the deploy. `unsafe.bindings` is a Workers-only escape hatch;
# Cloudflare Pages rejects it, and because this file sets
# `pages_build_output_dir` the Pages build DOES parse it. Every build from
# 28c9b049 (the commit that added the block) onward failed with "Build failed"
# while `ci` stayed green — CI only runs `npm test`, it does not deploy — so
# the site silently kept serving the last good build and the local tree looked
# fine. Note this contradicts the older "wrangler.toml is inert for Pages" note
# in CLAUDE.md: inert for *bindings*, not un-parsed.
#
# To actually enable the limiter, add the binding in the Pages dashboard
# (Settings → Functions → Bindings), not here. Until then _ratelimit.js finds
# no `env.API_RATE_LIMITER` and FAILS OPEN by design — the documented
# behaviour, guarded by api-throttle.test.mjs's "an unconfigured limiter fails
# OPEN, not closed". The limit lives in RATE_LIMIT.requestsPerMinute in
# _ratelimit.js; keep any dashboard binding at 30/60 to match.
