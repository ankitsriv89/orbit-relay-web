# Cloudflare Pages config for Orbital Relay
# Deploy: git push → Cloudflare auto-deploys from GitHub
# Domain: orbitalrelay.space

name = "orbit-relay"
pages_build_output_dir = "public"
compatibility_date = "2024-11-01"

# ---- Orbit catalog D1 binding (shared from signal-playground) --------
# Read side only. The Pages Functions (/api/object, /api/search, /api/feed, and
# the tle.js Space-Track read-through) query this; the orbit-ingest Worker owns
# writing to it and carries its own copy of this binding.
#
# Schema is applied in the signal-playground wrangler.toml:
#   wrangler d1 execute orbit-catalog --remote --file d1/orbit.sql
[[d1_databases]]
binding = "ORBIT_DB"
database_name = "orbit-catalog"
database_id = "e5fe1563-71ef-4fb4-9e04-554c87caf821"

# ---- Orbit artifacts R2 binding (shared from signal-playground) ------
# Pre-rendered TLE bundles + feed JSON, regenerated after each ingest so the
# globe's hot path is a flat object read rather than a D1 query. Read side only
# here; the orbit-ingest Worker writes these and carries its own binding.
[[r2_buckets]]
binding = "ORBIT_R2"
bucket_name = "orbit-data"

# ---- Public API rate limiting ----------------------------------------------
# 30 requests/minute per IP over /api/*, applied by functions/api/_middleware.js
# via the shared helper in functions/api/_ratelimit.js.
#
# This is the free, edge-side rate limiting binding — it keeps no storage of
# our own, which is why it is used here rather than a counter in KV. ORBIT_KV
# is bound ONLY to the ingest Worker on purpose (it holds the live Space-Track
# session cookie) and binding it to Pages to count requests would break that.
#
# `period` accepts only 10 or 60. The limit here must match RATE_LIMIT
# .requestsPerMinute in _ratelimit.js; api-throttle.test.mjs pins both to 30.
#
# The namespace_id is a rate-limiter id, local to this account's Workers
# config — it is not a secret and not a resource that has to exist beforehand.
[[unsafe.bindings]]
name = "API_RATE_LIMITER"
type = "ratelimit"
namespace_id = "1001"
simple = { limit = 30, period = 60 }
